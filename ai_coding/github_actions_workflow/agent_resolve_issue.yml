name: Issue Agent Resolve

on:
  issues:
    types:
      - labeled
  issue_comment:
    types:
      - created

jobs:
  resolve-issue:
    # ai_agent ラベル付与時、または /retry コメント時（ai_agent ラベルが付いている Issue のみ）
    if: >-
      (github.event_name == 'issues' && github.event.label.name == 'ai_agent')
      || (
        github.event_name == 'issue_comment'
        && contains(github.event.comment.body, '/retry')
        && contains(toJson(github.event.issue.labels.*.name), 'ai_agent')
      )
    runs-on: [self-hosted, linux, x64, desktop]
    container:
      image: node:26
    concurrency:
      group: issue-agent-${{ github.event.issue.number }}
      cancel-in-progress: true
    permissions:
      contents: write
      pull-requests: write
      issues: write
    timeout-minutes: 30
    env:
      BASE_BRANCH: develop
    defaults:
      run:
        # self-hosted + container では checkout 先が /__w/... にマウントされる
        working-directory: /__w/${{ github.event.repository.name }}/${{ github.event.repository.name }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Install GitHub CLI
        run: |
          set -euo pipefail
          apt-get update -qq
          DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends gh ca-certificates

      - name: Configure git
        run: |
          set -euo pipefail
          CONTAINER_WORKSPACE="/__w/${{ github.event.repository.name }}/${{ github.event.repository.name }}"
          git config --global --add safe.directory "${CONTAINER_WORKSPACE}"
          git config --global --add safe.directory "${{ github.workspace }}"
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"

      - name: Prepare issue context
        env:
          GITHUB_EVENT_ISSUE: ${{ toJson(github.event.issue) }}
          EVENT_NAME: ${{ github.event_name }}
          BASE_BRANCH: ${{ env.BASE_BRANCH }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          node <<'NODE'
          const fs = require('fs');
          const { execFileSync } = require('child_process');
          const issue = JSON.parse(process.env.GITHUB_EVENT_ISSUE);
          const number = String(issue.number);
          const title = issue.title ?? '';
          const body = issue.body ?? '';
          const isRetry = process.env.EVENT_NAME === 'issue_comment';

          fs.writeFileSync('/tmp/issue_number.txt', number);
          fs.writeFileSync('/tmp/issue_title.txt', title);
          fs.writeFileSync('/tmp/issue_body.md', body);

          // /retry 時は Issue のコメント履歴を取得してコンテキストに含める
          let commentContext = '';
          if (isRetry) {
            try {
              const comments = execFileSync(
                'gh',
                ['issue', 'view', number, '--json', 'comments', '--jq', '.comments[].body'],
                { encoding: 'utf8', env: process.env },
              ).trim();
              if (comments) {
                commentContext = `\n\nIssue のコメント履歴（質問への回答を含む）:\n${comments}`;
              }
            } catch {
              // コメント取得失敗時は無視
            }
          }

          fs.writeFileSync('/tmp/agent_prompt.txt', [
            '以下の GitHub Issue に書かれた指示に従い、このリポジトリのコードを修正してください。',
            '',
            `Issue #${number}: ${title}`,
            '',
            '指示内容:',
            body,
            commentContext,
            '',
            '要件:',
            '- Issue の指示どおりに必要なファイルを編集する',
            '- 変更は最小限にし、既存のコーディング規約に従う',
            '- 情報が不足していたり判断が難しい場合は、コード変更を行わず /tmp/need_help.txt に質問内容を日本語で書き出すこと',
          ].join('\n'));

          fs.writeFileSync('/tmp/pr_body.md', [
            `Issue #${number} の指示に基づきコードを修正しました。`,
            '',
            `ベースブランチ: \`${process.env.BASE_BRANCH}\``,
          ].join('\n'));
          NODE

      - name: Create or checkout branch for issue
        env:
          EVENT_NAME: ${{ github.event_name }}
        run: |
          set -euo pipefail
          ISSUE_NUMBER="$(cat /tmp/issue_number.txt)"
          BRANCH_NAME="issue-${ISSUE_NUMBER}"

          # 既存リモートブランチを develop にリセットせずチェックアウト
          checkout_remote_branch() {
            git fetch origin "${BRANCH_NAME}"
            if git show-ref --verify --quiet "refs/heads/${BRANCH_NAME}"; then
              git checkout "${BRANCH_NAME}"
              git merge --ff-only "origin/${BRANCH_NAME}"
            else
              git checkout -b "${BRANCH_NAME}" --track "origin/${BRANCH_NAME}"
            fi
          }

          if [ "${EVENT_NAME}" = "issue_comment" ]; then
            # /retry: 必ず既存の issue-* ブランチを継続（tr/develop へ戻さない）
            if ! git ls-remote --exit-code --heads origin "${BRANCH_NAME}" >/dev/null 2>&1; then
              echo "::error::/retry にはリモートブランチ ${BRANCH_NAME} が必要です。ai_agent ラベルで初回実行してから /retry してください。"
              exit 1
            fi
            checkout_remote_branch
          else
            # ai_agent ラベル付与（初回）: 既存ブランチがあれば継続、なければ develop から作成
            git fetch origin "${BASE_BRANCH}"
            if git ls-remote --exit-code --heads origin "${BRANCH_NAME}" >/dev/null 2>&1; then
              checkout_remote_branch
            else
              git checkout -B "${BRANCH_NAME}" "origin/${BASE_BRANCH}"
            fi
          fi

      - name: Install Cursor CLI
        run: |
          set -euo pipefail
          export HOME=/root
          curl https://cursor.com/install -fsS | bash
          echo "/root/.local/bin" >> "${GITHUB_PATH}"

      - name: Apply code changes from issue instructions
        id: apply_agent
        env:
          CURSOR_API_KEY: ${{ secrets.CURSOR_TOKEN }}
        run: |
          set -euo pipefail
          agent -p --force "$(cat /tmp/agent_prompt.txt)"

      - name: Ask for help if needed
        id: need_help
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          if [ -f /tmp/need_help.txt ]; then
            ISSUE_NUMBER="$(cat /tmp/issue_number.txt)"
            QUESTION="$(cat /tmp/need_help.txt)"
            printf "@some-user 情報が不足しているため確認させてください。\n\n%s" "${QUESTION}" > /tmp/help_comment.md
            gh issue comment "${ISSUE_NUMBER}" --body-file /tmp/help_comment.md
            echo "::error::Agent が追加情報を必要としています。Issue に質問を投稿しました。"
            exit 1
          fi

      - name: Create pull request
        id: create_pr
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          node <<'NODE'
          const { execFileSync } = require('child_process');
          const fs = require('fs');

          const issueNumber = fs.readFileSync('/tmp/issue_number.txt', 'utf8').trim();
          const issueTitle = fs.readFileSync('/tmp/issue_title.txt', 'utf8');
          const baseBranch = process.env.BASE_BRANCH;
          const branchName = `issue-${issueNumber}`;
          const prTitle = `Issue #${issueNumber}: ${issueTitle}`;

          const gh = (...args) => {
            execFileSync('gh', args, { stdio: 'inherit', env: process.env });
          };

          const commentOnIssue = (body) => {
            fs.writeFileSync('/tmp/issue_comment.md', body);
            gh('issue', 'comment', issueNumber, '--body-file', '/tmp/issue_comment.md');
          };

          execFileSync('git', ['add', '-A'], { stdio: 'inherit' });
          try {
            execFileSync('git', ['diff', '--staged', '--quiet'], { stdio: 'inherit' });
            commentOnIssue('Agent によるコード変更はありませんでした。Issue の指示内容を確認してください。');
            console.error('::error::Agent によるコード変更はありませんでした。');
            process.exit(1);
          } catch {
            // staged changes exist
          }

          execFileSync(
            'git',
            ['commit', '-m', `feat: apply changes for issue #${issueNumber}`],
            { stdio: 'inherit' },
          );
          execFileSync('git', ['push', '-u', 'origin', branchName], { stdio: 'inherit' });

          const existingPr = execFileSync(
            'gh',
            [
              'pr', 'list',
              '--head', branchName,
              '--base', baseBranch,
              '--json', 'number,url',
              '--jq', '.[0]',
            ],
            { encoding: 'utf8', env: process.env },
          ).trim();

          if (existingPr && existingPr !== 'null') {
            const pr = JSON.parse(existingPr);
            const updateComment = `新しいコミットを \`${branchName}\` にプッシュしました。`;
            fs.writeFileSync('/tmp/pr_update_comment.md', updateComment);
            commentOnIssue(
              `ブランチ \`${branchName}\` を更新しました。既存の PR #${pr.number} を確認してください。\n\n${pr.url}`,
            );
            gh('pr', 'comment', String(pr.number), '--body-file', '/tmp/pr_update_comment.md');
            process.exit(0);
          }

          gh(
            'pr', 'create',
            '--base', baseBranch,
            '--head', branchName,
            '--title', prTitle,
            '--body-file', '/tmp/pr_body.md',
            '--reviewer', 'some-user',
          );

          const createdPr = JSON.parse(
            execFileSync(
              'gh',
              [
                'pr', 'list',
                '--head', branchName,
                '--base', baseBranch,
                '--json', 'number,url',
                '--jq', '.[0]',
              ],
              { encoding: 'utf8', env: process.env },
            ).trim(),
          );

          commentOnIssue(`PR #${createdPr.number} を作成しました（base: \`${baseBranch}\`）。\n\n${createdPr.url}`);
          NODE

      - name: Determine failure reason
        if: failure()
        id: failure_reason
        run: |
          REASON="不明なエラー"
          if [ "${{ steps.need_help.outcome }}" = "failure" ]; then
            REASON="追加情報が必要です"
          elif [ "${{ steps.create_pr.outcome }}" = "failure" ]; then
            REASON="コード変更がありませんでした"
          elif [ "${{ steps.apply_agent.outcome }}" = "failure" ]; then
            REASON="Agent の実行に失敗しました"
          fi
          echo "reason=${REASON}" >> "${GITHUB_OUTPUT}"

      - name: Notify Slack on failure
        if: failure()
        uses: slackapi/slack-github-action@v2.1.1
        with:
          webhook: ${{ secrets.SLACK_WEBHOOK_URL }}
          webhook-type: incoming-webhook
          payload: |
            text: "*Issue Agent Resolve*: 失敗（${{ steps.failure_reason.outputs.reason }}）\nIssue: ${{ github.event.issue.html_url }}\nRun: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
            blocks:
              - type: "section"
                text:
                  type: "mrkdwn"
                  text: "GitHub Action *Issue Agent Resolve* が失敗しました。\n理由: ${{ steps.failure_reason.outputs.reason }}\nIssue: ${{ github.event.issue.html_url }}\nRun: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
